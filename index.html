<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizQuest - Classroom Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Robust Firebase Loading for Google Sites -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, collection, arrayUnion, runTransaction } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        window.FB_SDK = { 
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, collection, arrayUnion, runTransaction 
        };
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @keyframes bounce-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-bounce-slow { animation: bounce-slow 2s infinite ease-in-out; }
        .animate-spin-slow { animation: spin-slow 12s linear infinite; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #f8fafc; }
        .custom-shadow { box-shadow: 0 10px 0 0 rgba(0,0,0,0.05); }
        
        /* Fix for potential layout shifts during icon loading */
        .icon-wrapper { display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
        .icon-wrapper svg { display: block; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Configuration Fallbacks
        const getSafeConfig = () => {
            try {
                if (typeof window.__firebase_config !== 'undefined') {
                    return JSON.parse(window.__firebase_config);
                }
            } catch (e) { console.error("Config Parse Error", e); }
            return null;
        };

        const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'quiz-quest-default';

        /**
         * Enhanced Icon Component
         * Fixes the "removeChild" error by wrapping the icon in a stable span.
         * Lucide's createIcons replaces <i> with <svg>, which confuses React's DOM reconciliation.
         * By using a wrapper, React only manages the span, preventing the crash.
         */
        const Icon = ({ name, size = 24, className = "" }) => {
            const wrapperRef = useRef(null);

            useEffect(() => {
                if (window.lucide && wrapperRef.current) {
                    // Create a fresh <i> tag for Lucide to replace
                    wrapperRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    
                    // Trigger Lucide. Scoping it helps prevent global DOM issues.
                    window.lucide.createIcons({
                        attrs: {
                            width: size,
                            height: size,
                            class: className
                        },
                        nameAttr: 'data-lucide'
                    });
                }
            }, [name, size, className]);

            return <span ref={wrapperRef} className="icon-wrapper"></span>;
        };

        const generateJoinCode = () => Math.floor(100000 + Math.random() * 900000).toString();

        const App = () => {
            const [fbLoaded, setFbLoaded] = useState(false);
            const [config, setConfig] = useState(getSafeConfig());
            const [user, setUser] = useState(null);
            const [view, setView] = useState('loading');
            const [role, setRole] = useState(null);
            const [gameCode, setGameCode] = useState('');
            const [nickname, setNickname] = useState('');
            const [gameState, setGameState] = useState(null);
            const [statusMsg, setStatusMsg] = useState('');
            const [copySuccess, setCopySuccess] = useState(false);
            const [customUrl, setCustomUrl] = useState('');
            const [isEditingUrl, setIsEditingUrl] = useState(false);
            const [liveQ, setLiveQ] = useState({ text: '', options: ['', ''], correctAnswer: 0 });

            // 1. Wait for SDK availability
            useEffect(() => {
                const checkSDK = setInterval(() => {
                    if (window.FB_SDK) {
                        setFbLoaded(true);
                        clearInterval(checkSDK);
                    }
                }, 100);
                return () => clearInterval(checkSDK);
            }, []);

            // 2. Auth Logic
            useEffect(() => {
                if (!fbLoaded || !config) {
                    if (fbLoaded && !config) setView('setup-needed');
                    return;
                }

                const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore } = window.FB_SDK;
                
                let auth, db;
                try {
                    const fbApp = initializeApp(config);
                    auth = getAuth(fbApp);
                    db = getFirestore(fbApp);
                } catch (e) {
                    console.error("Firebase Init Error", e);
                    return;
                }

                const initAuth = async () => {
                    try {
                        if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
                            await signInWithCustomToken(auth, window.__initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) { console.error("Auth Error", err); }
                };

                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    if (u && view === 'loading') setView('landing');
                });

                return () => unsubscribe();
            }, [fbLoaded, config]);

            // 3. Real-time Game Sync
            useEffect(() => {
                if (!user || !gameCode || !fbLoaded) return;
                const { getFirestore, doc, onSnapshot } = window.FB_SDK;
                const db = getFirestore();
                const gameRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', gameCode);

                const unsubscribe = onSnapshot(gameRef, (snap) => {
                    if (snap.exists()) {
                        setGameState(snap.data());
                    } else if (role === 'student' && view !== 'landing') {
                        setStatusMsg("Game session ended.");
                        setView('landing');
                    }
                }, (error) => {
                    console.error("Firestore Error:", error);
                });

                return () => unsubscribe();
            }, [user, gameCode, role, fbLoaded, view]);

            // 4. Site URL Detection for Google Sites
            useEffect(() => {
                const current = window.location.href;
                if (current.includes('googleusercontent') || current.includes('blob:')) {
                    setCustomUrl(''); 
                } else {
                    setCustomUrl(current);
                }
            }, []);

            // --- Handlers ---
            const handleCreate = async (questions, isLive = false) => {
                const { getFirestore, doc, setDoc } = window.FB_SDK;
                const db = getFirestore();
                const code = generateJoinCode();
                const session = {
                    code, teacherId: user.uid, status: 'lobby', isLive,
                    currentQuestionIndex: isLive ? -1 : 0,
                    questions: isLive ? [] : questions,
                    players: [], responses: [], createdAt: Date.now()
                };
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', code), session);
                    setGameCode(code);
                    setView('teacher-lobby');
                } catch (e) { setStatusMsg("Database Error"); }
            };

            const handleJoin = async () => {
                if (!nickname || !gameCode) return setStatusMsg("Name and Code required");
                const { getFirestore, doc, getDoc, updateDoc, arrayUnion } = window.FB_SDK;
                const db = getFirestore();
                const gameRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', gameCode);
                
                try {
                    const snap = await getDoc(gameRef);
                    if (snap.exists() && snap.data().status === 'lobby') {
                        await updateDoc(gameRef, { 
                            players: arrayUnion({ uid: user.uid, name: nickname, score: 0 }) 
                        });
                        setRole('student');
                        setView('student-lobby');
                    } else {
                        setStatusMsg("Game not found or already started.");
                    }
                } catch (e) { setStatusMsg("Join failed."); }
            };

            const handleNext = async () => {
                const { getFirestore, doc, updateDoc } = window.FB_SDK;
                const db = getFirestore();
                const gameRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', gameCode);
                
                let nextStatus = 'active';
                if (gameState.status === 'active') nextStatus = 'leaderboard';
                else if (gameState.status === 'leaderboard') {
                    const nextIdx = gameState.currentQuestionIndex + 1;
                    if (nextIdx < gameState.questions.length || gameState.isLive) {
                        nextStatus = gameState.isLive ? 'live-prep' : 'active';
                        await updateDoc(gameRef, { 
                            status: nextStatus, 
                            currentQuestionIndex: nextIdx, 
                            responses: [] 
                        });
                        return;
                    } else {
                        nextStatus = 'finished';
                    }
                } else if (gameState.status === 'lobby' && gameState.isLive) {
                    nextStatus = 'live-prep';
                }

                await updateDoc(gameRef, { status: nextStatus });
            };

            // --- UI Views ---

            if (view === 'setup-needed') return (
                <div className="min-h-screen bg-slate-100 flex items-center justify-center p-6 text-center">
                    <div className="bg-white p-10 rounded-3xl shadow-xl max-w-md">
                        <Icon name="settings" size={64} className="text-slate-400 mb-4" />
                        <h2 className="text-2xl font-black mb-2">Setup Required</h2>
                        <p className="text-slate-500 mb-6">Configuration missing. Paste your Firebase Config below to activate.</p>
                        <textarea 
                            className="w-full h-32 p-3 bg-slate-50 border rounded-xl font-mono text-xs mb-4" 
                            placeholder='{"apiKey": "...", "projectId": "...", ...}'
                            onChange={(e) => {
                                try {
                                    const parsed = JSON.parse(e.target.value);
                                    setConfig(parsed);
                                } catch(err) {}
                            }}
                        />
                        <p className="text-[10px] text-slate-400 uppercase font-black">Paste valid JSON to continue</p>
                    </div>
                </div>
            );

            if (view === 'loading') return (
                <div className="min-h-screen bg-yellow-50 flex flex-col items-center justify-center p-6">
                    <Icon name="loader-2" size={48} className="text-yellow-500 animate-spin mb-4" />
                    <p className="font-black text-yellow-600 tracking-widest uppercase">Connecting to Quest...</p>
                </div>
            );

            if (view === 'landing') return (
                <div className="min-h-screen bg-yellow-50 flex flex-col items-center justify-center p-6 text-center">
                    <div className="bg-white p-10 md:p-16 rounded-[48px] shadow-2xl border-b-[12px] border-yellow-200 max-w-lg w-full">
                        <div className="bg-blue-500 w-28 h-28 mx-auto rounded-[32px] flex items-center justify-center shadow-lg mb-8 animate-bounce-slow">
                            <Icon name="school" size={56} className="text-white" />
                        </div>
                        <h1 className="text-5xl md:text-6xl font-black text-blue-600 mb-2 tracking-tighter">QuizQuest</h1>
                        <p className="text-gray-400 font-bold mb-10 text-xl tracking-wide uppercase">Classroom Learning</p>
                        
                        {statusMsg && <div className="mb-6 text-red-500 font-bold bg-red-50 p-4 rounded-2xl border border-red-100">{statusMsg}</div>}
                        
                        <div className="space-y-4">
                            <button onClick={() => {setRole('teacher'); setView('teacher-setup');}} className="w-full bg-green-500 text-white font-black py-5 rounded-[24px] text-2xl border-b-8 border-green-700 active:scale-95 transition-transform">TEACHER</button>
                            <button onClick={() => setView('student-join')} className="w-full bg-blue-500 text-white font-black py-5 rounded-[24px] text-2xl border-b-8 border-blue-700 active:scale-95 transition-transform">STUDENT</button>
                        </div>
                    </div>
                </div>
            );

            if (view === 'teacher-setup') return (
                <div className="min-h-screen bg-green-50 p-6 md:p-12">
                    <div className="max-w-4xl mx-auto text-center">
                        <h2 className="text-4xl font-black text-green-700 mb-10 uppercase italic tracking-tighter">Choose Mode</h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <button onClick={() => handleCreate([], true)} className="bg-purple-600 text-white p-10 rounded-[40px] shadow-xl border-b-[12px] border-purple-800 hover:scale-[1.05] transition-all">
                                <Icon name="zap" size={64} className="mb-4" />
                                <h3 className="text-3xl font-black">LIVE MODE</h3>
                                <p className="font-bold opacity-75 mt-2">Questions on the fly!</p>
                            </button>
                            <button onClick={() => handleCreate([
                                { text: "What is 10 + 10?", options: ["20", "25", "15", "30"], correctAnswer: 0 },
                                { text: "What color is the sky on a clear day?", options: ["Green", "Blue", "Red", "Yellow"], correctAnswer: 1 }
                            ])} className="bg-blue-600 text-white p-10 rounded-[40px] shadow-xl border-b-[12px] border-blue-800 hover:scale-[1.05] transition-all">
                                <Icon name="clipboard-list" size={64} className="mb-4" />
                                <h3 className="text-3xl font-black">PRESET QUIZ</h3>
                                <p className="font-bold opacity-75 mt-2">Standard mode</p>
                            </button>
                        </div>
                        <button onClick={() => setView('landing')} className="mt-12 text-green-700 font-black uppercase tracking-widest bg-white/50 px-6 py-2 rounded-full">Back</button>
                    </div>
                </div>
            );

            if (view === 'student-join') return (
                <div className="min-h-screen bg-blue-50 flex flex-col items-center justify-center p-6">
                    <div className="bg-white p-10 rounded-[40px] shadow-2xl w-full max-w-md border-b-[10px] border-blue-100">
                        <h2 className="text-3xl font-black text-blue-600 mb-8 text-center uppercase">Join!</h2>
                        <input type="text" placeholder="Your Name" className="w-full bg-gray-50 border-4 border-gray-100 rounded-[20px] p-4 mb-4 font-bold text-xl outline-none focus:border-blue-200" value={nickname} onChange={e => setNickname(e.target.value)} />
                        <input type="text" placeholder="Join Code" className="w-full bg-gray-50 border-4 border-gray-100 rounded-[20px] p-4 mb-8 font-black text-center text-4xl outline-none focus:border-blue-200" value={gameCode} onChange={e => setGameCode(e.target.value)} />
                        <button onClick={handleJoin} className="w-full bg-green-500 text-white font-black py-5 rounded-[24px] text-2xl border-b-8 border-green-700 active:scale-95">JOIN GAME</button>
                        <button onClick={() => setView('landing')} className="w-full mt-4 text-gray-400 font-bold">Cancel</button>
                    </div>
                </div>
            );

            if (role === 'teacher' && gameState?.status === 'lobby') {
                const qrSource = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(customUrl || 'Set URL first')}`;
                return (
                    <div className="min-h-screen bg-green-50 p-4 md:p-8 flex flex-col items-center">
                        <div className="bg-white w-full max-w-5xl p-8 rounded-[48px] shadow-2xl border-b-[12px] border-green-100">
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10 mb-10">
                                <div className="bg-green-100/50 p-8 rounded-[32px] flex flex-col items-center justify-center border-4 border-green-200">
                                    <span className="text-sm font-black text-green-700 uppercase mb-2 tracking-widest">Code</span>
                                    <div className="text-8xl md:text-9xl font-black text-green-600 tracking-tighter mb-6">{gameCode}</div>
                                    <div className="w-full bg-white p-4 rounded-3xl shadow-sm border-2 border-green-200">
                                        <div className="flex justify-between items-center mb-3">
                                            <span className="text-xs font-black text-slate-400 uppercase tracking-widest">Site URL</span>
                                            <button onClick={() => setIsEditingUrl(!isEditingUrl)} className="text-blue-500 text-xs font-bold uppercase">{isEditingUrl ? 'Cancel' : 'Update URL'}</button>
                                        </div>
                                        {!customUrl && !isEditingUrl && (
                                            <div className="bg-orange-50 p-4 rounded-2xl text-[11px] text-orange-700 font-bold mb-3 border border-orange-100">
                                                ⚠️ Click 'Update URL' and paste your public website link for the QR code to work.
                                            </div>
                                        )}
                                        {isEditingUrl ? (
                                            <div className="flex gap-2">
                                                <input type="text" value={customUrl} onChange={e => setCustomUrl(e.target.value)} className="flex-1 p-3 text-sm border-2 rounded-xl" placeholder="https://sites.google.com/..." />
                                                <button onClick={() => setIsEditingUrl(false)} className="bg-blue-500 text-white px-5 rounded-xl text-sm font-bold">SAVE</button>
                                            </div>
                                        ) : (
                                            <button onClick={() => {
                                                const el = document.createElement('textarea');
                                                el.value = customUrl;
                                                document.body.appendChild(el);
                                                el.select();
                                                document.execCommand('copy');
                                                document.body.removeChild(el);
                                                setCopySuccess(true);
                                                setTimeout(() => setCopySuccess(false), 2000);
                                            }} className={`w-full py-4 rounded-2xl font-black text-sm flex items-center justify-center gap-3 transition-colors ${copySuccess ? 'bg-blue-500 text-white' : 'bg-slate-50 text-slate-600'}`}>
                                                <Icon name={copySuccess ? 'check' : 'copy'} size={18} /> {copySuccess ? 'Copied' : 'Copy Site Link'}
                                            </button>
                                        )}
                                    </div>
                                </div>
                                <div className="bg-white p-10 rounded-[40px] border-8 border-dashed border-slate-100 flex flex-col items-center justify-center">
                                    {!customUrl ? (
                                        <div className="text-slate-300 text-center font-black p-12">
                                            <Icon name="qr-code" size={64} className="mx-auto mb-2 opacity-20" />
                                            <p>Enter Site URL for QR</p>
                                        </div>
                                    ) : (
                                        <img src={qrSource} className="w-56 h-56" alt="QR Code" />
                                    )}
                                    <span className="text-[12px] font-black text-slate-300 uppercase mt-4 tracking-[0.3em]">Scan to Join</span>
                                </div>
                            </div>
                            
                            <div className="mb-10">
                                <h3 className="text-2xl font-black text-slate-700 mb-6 flex items-center gap-3"><Icon name="users" className="text-green-500" /> Joined ({gameState.players.length})</h3>
                                <div className="flex flex-wrap gap-3">
                                    {gameState.players.map(p => (
                                        <div key={p.uid} className="bg-blue-50 px-6 py-3 rounded-2xl font-black text-blue-700 border-2 border-blue-100 flex items-center gap-4">
                                            {p.name}
                                            <button onClick={async () => {
                                                const { getFirestore, doc, updateDoc } = window.FB_SDK;
                                                await updateDoc(doc(getFirestore(), 'artifacts', appId, 'public', 'data', 'sessions', gameCode), {
                                                    players: gameState.players.filter(x => x.uid !== p.uid)
                                                });
                                            }} className="hover:text-red-500"><Icon name="x" size={18} /></button>
                                        </div>
                                    ))}
                                    {gameState.players.length === 0 && <p className="text-slate-300 font-bold italic">Waiting for students...</p>}
                                </div>
                            </div>

                            <button onClick={handleNext} disabled={gameState.players.length === 0} className="w-full bg-orange-500 text-white font-black py-7 rounded-[32px] text-4xl shadow-2xl border-b-[12px] border-orange-700 disabled:opacity-30 active:scale-95 transition-all">START GAME!</button>
                        </div>
                    </div>
                );
            }

            if (role === 'student' && (gameState?.status === 'lobby' || gameState?.status === 'live-prep')) return (
                <div className="min-h-screen bg-blue-50 flex flex-col items-center justify-center p-6 text-center">
                    <div className="bg-white p-16 rounded-[64px] shadow-2xl max-w-sm w-full border-b-[16px] border-blue-100">
                        <Icon name="star" size={96} className="text-blue-500 mx-auto mb-8 animate-spin-slow" />
                        <h2 className="text-4xl font-black text-blue-600 mb-4 tracking-tighter">YOU'RE IN!</h2>
                        <p className="text-gray-400 font-bold mb-10 italic uppercase tracking-widest text-sm">
                            {gameState.status === 'live-prep' ? 'Teacher is thinking...' : 'Wait for teacher to start...'}
                        </p>
                        <div className="bg-blue-500 text-white p-6 rounded-[24px] text-2xl font-black shadow-lg uppercase tracking-widest">{nickname}</div>
                    </div>
                </div>
            );

            if (gameState?.status === 'active') {
                const currentQ = gameState.questions[gameState.currentQuestionIndex];
                const responses = gameState.responses || [];
                const hasAnswered = responses.find(r => r.uid === user.uid && r.questionIndex === gameState.currentQuestionIndex);
                
                if (role === 'student' && hasAnswered) return (
                    <div className={`min-h-screen flex flex-col items-center justify-center p-6 text-center transition-colors duration-500 ${hasAnswered.isCorrect ? 'bg-green-500' : 'bg-red-500'}`}>
                        <div className="bg-white p-12 rounded-[56px] shadow-2xl w-full max-w-md animate-in zoom-in duration-300">
                            <Icon name={hasAnswered.isCorrect ? 'thumbs-up' : 'thumbs-down'} size={80} className={`mx-auto mb-6 ${hasAnswered.isCorrect ? 'text-green-500' : 'text-red-500'}`} />
                            <h2 className="text-5xl font-black mb-4 tracking-tighter uppercase">{hasAnswered.isCorrect ? 'Correct!' : 'Oops!'}</h2>
                            <div className="text-3xl font-black p-6 bg-slate-50 rounded-[32px] inline-block border-b-4 border-slate-200">{hasAnswered.gain} PTS</div>
                            <p className="mt-12 text-slate-400 font-black animate-pulse tracking-widest uppercase text-xs italic">Look at the big screen!</p>
                        </div>
                    </div>
                );

                return (
                    <div className="min-h-screen bg-purple-50 p-4 md:p-8 flex flex-col">
                        <div className="max-w-4xl mx-auto w-full flex-grow flex flex-col">
                            <div className="flex justify-between items-center bg-white p-4 rounded-[24px] shadow-sm mb-8 border-b-4 border-purple-100">
                                <span className="bg-purple-600 text-white px-6 py-2 rounded-xl font-black text-sm uppercase tracking-widest">Question {gameState.currentQuestionIndex + 1}</span>
                                {role === 'teacher' && <button onClick={handleNext} className="bg-orange-500 text-white px-6 py-2 rounded-xl font-black border-b-4 border-orange-700 active:scale-95">SHOW RESULTS</button>}
                                <div className="text-purple-600 font-black flex items-center gap-3"><Icon name="users" size={20} /> {responses.length} / {gameState.players.length}</div>
                            </div>
                            <div className="bg-white p-12 md:p-20 rounded-[56px] shadow-2xl border-b-[12px] border-purple-100 mb-8 text-center flex-grow flex items-center justify-center">
                                <h1 className="text-3xl md:text-5xl font-black text-slate-800 leading-tight">{currentQ?.text || 'Loading...'}</h1>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                {currentQ?.options?.map((opt, i) => (
                                    <button key={i} disabled={role === 'teacher'} onClick={async () => {
                                        const { getFirestore, doc, runTransaction, arrayUnion } = window.FB_SDK;
                                        const db = getFirestore();
                                        const gameRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', gameCode);
                                        await runTransaction(db, async (tx) => {
                                            const snap = await tx.get(gameRef);
                                            const data = snap.data();
                                            if (data.responses.some(r => r.uid === user.uid && r.questionIndex === data.currentQuestionIndex)) return;
                                            const isCorrect = i === data.questions[data.currentQuestionIndex].correctAnswer;
                                            const correctCount = data.responses.filter(r => r.isCorrect).length;
                                            const gain = isCorrect ? (10 + Math.max(0, 20 - (correctCount * 5))) : -5;
                                            tx.update(gameRef, {
                                                responses: arrayUnion({ uid: user.uid, questionIndex: data.currentQuestionIndex, isCorrect, gain }),
                                                players: data.players.map(p => p.uid === user.uid ? {...p, score: Math.max(0, p.score + gain)} : p)
                                            });
                                        });
                                    }} className={`p-8 md:p-12 rounded-[40px] text-2xl font-black text-white text-left shadow-xl border-b-8 active:scale-95 transition-transform 
                                        ${i === 0 ? 'bg-red-500 border-red-700' : i === 1 ? 'bg-blue-500 border-blue-700' : i === 2 ? 'bg-yellow-500 border-yellow-700' : 'bg-green-500 border-green-700'} 
                                        ${role === 'teacher' ? 'opacity-80 cursor-default' : ''}`}>
                                        {opt}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            if (gameState && ['leaderboard', 'finished'].includes(gameState.status)) {
                const topPlayers = [...gameState.players].sort((a,b) => b.score - a.score).slice(0, 8);
                return (
                    <div className="min-h-screen bg-yellow-50 p-6 md:p-12 flex flex-col items-center">
                        <div className="max-w-3xl w-full bg-white p-10 rounded-[56px] shadow-2xl border-b-[16px] border-yellow-100">
                            <h2 className="text-4xl font-black text-center text-orange-500 mb-10 flex items-center justify-center uppercase italic tracking-tighter">
                                <Icon name="trophy" size={56} className="mr-4 text-yellow-400" /> {gameState.status === 'finished' ? "Final Scores!" : "Top Rankings"}
                            </h2>
                            <div className="space-y-4 mb-12">
                                {topPlayers.map((p, i) => (
                                    <div key={i} className={`flex justify-between p-6 rounded-[28px] font-black text-2xl ${i === 0 ? 'bg-yellow-400 text-yellow-900 shadow-xl scale-105' : 'bg-slate-50 text-slate-700 border-b-4 border-slate-200'}`}>
                                        <div className="flex items-center gap-5">
                                            <span className="w-12 h-12 bg-white/40 rounded-full flex items-center justify-center text-sm">#{i+1}</span> 
                                            {p.name}
                                        </div>
                                        <span>{p.score}</span>
                                    </div>
                                ))}
                                {topPlayers.length === 0 && <p className="text-center text-slate-300 italic">No scores yet!</p>}
                            </div>
                            {role === 'teacher' && (
                                <button onClick={handleNext} className="w-full bg-green-500 text-white font-black py-6 rounded-[32px] text-3xl shadow-xl border-b-[12px] border-green-700 active:scale-95">
                                    {gameState.status === 'finished' ? 'CLOSE GAME' : 'NEXT QUESTION'}
                                </button>
                            )}
                            {role === 'student' && gameState.status === 'finished' && (
                                <button onClick={() => window.location.reload()} className="w-full bg-slate-200 text-slate-500 font-black py-6 rounded-[32px] text-2xl">Return to Lobby</button>
                            )}
                        </div>
                    </div>
                );
            }

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
